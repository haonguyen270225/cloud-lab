server {
    listen 4173;
    server_name localhost;

    # Phuc vu React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy den Backend
    location /api/ {
        proxy_pass https://mern-backend-236115-2026.onrender.com/api/;

        proxy_http_version 1.1;

        # HTTPS SNI cho Backend Render
        proxy_ssl_server_name on;
        proxy_ssl_name mern-backend-236115-2026.onrender.com;

        proxy_set_header Host mern-backend-236115-2026.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
